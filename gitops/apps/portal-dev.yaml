apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edymonte/azure-enterprise-platform.git
    targetRevision: main
    path: gitops/charts/customer-portal
    helm:
      valueFiles:
        - ../../envs/dev/platform.values.yaml
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: portal-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true        # manual kubectl changes are reverted (drift correction)
    syncOptions:
      - CreateNamespace=true
