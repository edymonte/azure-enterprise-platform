<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFS Customer Portal</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5b6475; --card: #fff; --accent: #0b5cad; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e8ebf0; --muted: #9aa3b2; --card: #1a2029; --accent: #5aa2ff; } }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .muted { color: var(--muted); }
    .banner { background: var(--card); border-left: 4px solid var(--accent); padding: 12px 16px; margin: 20px 0; border-radius: 6px; }
    ul { list-style: none; padding: 0; display: grid; gap: 10px; }
    li { background: var(--card); padding: 12px 16px; border-radius: 6px; display: flex; justify-content: space-between; }
    code { font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>Monteiro Financial Services</h1>
  <p class="muted">Customer Portal — <span id="meta">loading…</span></p>
  <div class="banner" id="banner">…</div>
  <h2>Products</h2>
  <ul id="products"></ul>
</main>
<script>
  async function load() {
    try {
      const info = await (await fetch('/api/info')).json();
      document.getElementById('meta').innerHTML =
        `<code>${info.environment}</code> · version <code>${info.version}</code> · pod <code>${info.pod}</code> · db <code>${info.database}</code>`;
      document.getElementById('banner').textContent = info.banner;
      const res = await fetch('/api/products');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      document.getElementById('products').innerHTML = (await res.json())
        .map(p => `<li><span>${p.name}</span><span class="muted">${p.category}</span></li>`).join('');
    } catch (err) {
      document.getElementById('products').innerHTML = `<li>Could not load products: ${err.message}</li>`;
    }
  }
  load();
</script>
</body>
</html>
